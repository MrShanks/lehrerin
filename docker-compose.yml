services:
  lehrerin:
    image: staffolis/lehrerin:latest
    container_name: lehrerin_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8080
    volumes:
      - ./data:/app/data
    expose:
      - "8080" # Internal communication only

  nginx:
    image: nginx:alpine
    container_name: lehrerin_nginx
    restart: unless-stopped
    ports:
      - "8091:80" # Only needed for local testing (optional once the tunnel is up)
    depends_on:
      - lehrerin
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: lehrerin_tunnel
    restart: unless-stopped
    env_file:
      - .env
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
